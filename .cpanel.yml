# cPanel "Git Version Control" deployment for WHC.
#
# IMPORTANT: apex-physio.ca is an addon domain on the remedypills.ca hosting plan.
#   apex-physio.ca  ->  ~/apex-physio.ca     (THIS site)
#   remedypills.ca  ->  ~/public_html        (pharmacy site: never deploy here)
#
# The live home page, services pages and PHP handlers in ~/apex-physio.ca are newer
# than apexphysio/ in this repo (they were edited directly on the server on Sep 18).
# So this deploy only adds the 3D muscle map and its form pre-fill script. It does not
# overwrite index.html, site.css, booking.js or any PHP file.
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/apex-physio.ca
    - test -d "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/pain-map"
    - /bin/cp apexphysio/pain-map/index.html apexphysio/pain-map/body.glb "$DEPLOYPATH/pain-map/"
    - /bin/cp apexphysio/painmap-prefill.js "$DEPLOYPATH/"
