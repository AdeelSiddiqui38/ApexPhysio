<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow & Book | Apex Physiotherapy & Wellness Clinic</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon-32.png">
<style>
:root{--lime:#9ADE1B;--lime-deep:#5E8C12;--ink:#14171A;--muted:#4E5760;--bg:#F6FAF0;--line:#DDE6CF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff,var(--bg));color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;justify-content:center;padding:28px 18px 40px}
main{width:100%;max-width:420px;text-align:center}
.logo{width:96px;height:96px;margin:6px auto 10px;display:block}
h1{font-size:1.45rem;line-height:1.2;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);margin:0 0 24px;font-size:.98rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 18px;margin:0 0 12px;border-radius:14px;text-decoration:none;font-weight:700;font-size:1.05rem;border:2px solid var(--ink);color:var(--ink);background:#fff;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn small{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.primary small{color:#2b3a0a}
.btn span.t{text-align:left}
.note{margin-top:22px;font-size:.84rem;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <img class="logo" src="../assets/apex-logo-icon.png" alt="Apex Physiotherapy & Wellness Clinic">
  <h1>Apex Physiotherapy &amp; Wellness Clinic</h1>
  <p class="sub">Follow us and book your visit, Nolan Hill, NW Calgary.</p>

  <a class="btn" href="https://www.facebook.com/profile.php?id=61596997735060" rel="noopener">
    <span class="t">Follow on Facebook<small>Tap Follow on our Page</small></span>
  </a>
  <a class="btn" href="https://www.instagram.com/apexphysio.yyc/" rel="noopener">
    <span class="t">Follow on Instagram<small>@apexphysio.yyc</small></span>
  </a>
  <a class="btn primary" href="https://apex-physio.janeapp.com/" rel="noopener">
    <span class="t">Book online<small>Choose a time that suits you</small></span>
  </a>

  <p class="note">
    <b>Unit 150, 246 Nolanridge Crescent NW, Calgary</b><br>
    825-509-7141 &nbsp;·&nbsp; <a href="https://apex-physio.ca/" style="color:var(--lime-deep)">apex-physio.ca</a>
  </p>
</main>
</body>
</html>
